<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#333"/>
    </marker>
    <style>
      .title { font-size: 18px; font-weight: bold; fill: #1a1a1a; }
      .node-title { font-size: 15px; font-weight: bold; fill: #fff; }
      .node-sub { font-size: 11px; fill: #fff; font-style: italic; }
      .leaf-title { font-size: 13px; font-weight: bold; fill: #1a1a1a; }
      .leaf-sub { font-size: 10px; fill: #555; }
      .label { font-size: 11px; fill: #555; font-style: italic; }
    </style>
  </defs>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" class="title">Arquitectura del lenguaje AgentDSL</text>

  <!-- program (root) -->
  <rect x="320" y="60" width="160" height="55" rx="8" fill="#2C5282" stroke="#1A365D" stroke-width="2"/>
  <text x="400" y="83" text-anchor="middle" class="node-title">program</text>
  <text x="400" y="100" text-anchor="middle" class="node-sub">punto de entrada</text>

  <!-- arrow program -> agent -->
  <line x1="400" y1="115" x2="400" y2="148" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="412" y="135" class="label">1..N</text>

  <!-- agent -->
  <rect x="320" y="150" width="160" height="55" rx="8" fill="#2B6CB0" stroke="#1A365D" stroke-width="2"/>
  <text x="400" y="173" text-anchor="middle" class="node-title">agent</text>
  <text x="400" y="190" text-anchor="middle" class="node-sub">declaración de agente</text>

  <!-- arrows agent -> sections -->
  <line x1="370" y1="205" x2="120" y2="258" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="385" y1="205" x2="305" y2="258" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="415" y1="205" x2="495" y2="258" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="430" y1="205" x2="680" y2="258" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- perceptions section -->
  <rect x="40" y="260" width="160" height="60" rx="8" fill="#3182CE" stroke="#2C5282" stroke-width="2"/>
  <text x="120" y="283" text-anchor="middle" class="node-title">perceptions</text>
  <text x="120" y="302" text-anchor="middle" class="node-sub">datos del entorno</text>

  <!-- state section -->
  <rect x="225" y="260" width="160" height="60" rx="8" fill="#3182CE" stroke="#2C5282" stroke-width="2"/>
  <text x="305" y="283" text-anchor="middle" class="node-title">state</text>
  <text x="305" y="302" text-anchor="middle" class="node-sub">variables internas</text>

  <!-- actions section -->
  <rect x="415" y="260" width="160" height="60" rx="8" fill="#3182CE" stroke="#2C5282" stroke-width="2"/>
  <text x="495" y="283" text-anchor="middle" class="node-title">actions</text>
  <text x="495" y="302" text-anchor="middle" class="node-sub">acciones ejecutables</text>

  <!-- behavior section -->
  <rect x="600" y="260" width="160" height="60" rx="8" fill="#3182CE" stroke="#2C5282" stroke-width="2"/>
  <text x="680" y="283" text-anchor="middle" class="node-title">behavior</text>
  <text x="680" y="302" text-anchor="middle" class="node-sub">reglas de decisión</text>

  <!-- arrows to leaves -->
  <line x1="120" y1="320" x2="120" y2="358" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="305" y1="320" x2="305" y2="358" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="495" y1="320" x2="495" y2="358" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="680" y1="320" x2="680" y2="358" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- leaves -->
  <rect x="30" y="360" width="180" height="70" rx="8" fill="#EDF2F7" stroke="#A0AEC0" stroke-width="1.5"/>
  <text x="120" y="382" text-anchor="middle" class="leaf-title">perceptionDecl</text>
  <text x="120" y="402" text-anchor="middle" class="leaf-sub">ID : type ;</text>
  <text x="120" y="418" text-anchor="middle" class="leaf-sub">ej: stock : int;</text>

  <rect x="215" y="360" width="180" height="70" rx="8" fill="#EDF2F7" stroke="#A0AEC0" stroke-width="1.5"/>
  <text x="305" y="382" text-anchor="middle" class="leaf-title">stateDecl</text>
  <text x="305" y="402" text-anchor="middle" class="leaf-sub">ID : type = literal ;</text>
  <text x="305" y="418" text-anchor="middle" class="leaf-sub">ej: alertLevel : int = 0;</text>

  <rect x="405" y="360" width="180" height="70" rx="8" fill="#EDF2F7" stroke="#A0AEC0" stroke-width="1.5"/>
  <text x="495" y="382" text-anchor="middle" class="leaf-title">actionDecl</text>
  <text x="495" y="402" text-anchor="middle" class="leaf-sub">action ID ( ) ;</text>
  <text x="495" y="418" text-anchor="middle" class="leaf-sub">ej: action restock();</text>

  <rect x="590" y="360" width="180" height="70" rx="8" fill="#EDF2F7" stroke="#A0AEC0" stroke-width="1.5"/>
  <text x="680" y="382" text-anchor="middle" class="leaf-title">ruleDecl</text>
  <text x="680" y="402" text-anchor="middle" class="leaf-sub">if condition then do ID();</text>
  <text x="680" y="418" text-anchor="middle" class="leaf-sub">ej: if stock &lt; 10 then do restock();</text>

  <!-- footer note -->
  <text x="400" y="475" text-anchor="middle" class="label">Cada agente se compone de cuatro secciones: percepción, estado, acciones y comportamiento.</text>
  <text x="400" y="492" text-anchor="middle" class="label">El comportamiento se define mediante reglas condicionales que disparan acciones declaradas.</text>
</svg>
